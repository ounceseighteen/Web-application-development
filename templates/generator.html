<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор паролей</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Генератор паролей</h1>

        <div class="nav-links">
            <a href="{{ url_for('generator', username=username) }}">Генератор</a>
            <a href="{{ url_for('manager', username=username) }}">Менеджер паролей</a>
            <a href="{{ url_for('logout') }}">Выйти</a>
        </div>

        <form method="POST">
            <label>Выберите сложность пароля:</label><br>
            <input type="radio" id="simple" name="complexity" value="simple" checked>
            <label for="simple">Простая</label><br>
            <input type="radio" id="complex" name="complexity" value="complex">
            <label for="complex">Сложная</label><br><br>

            <button type="submit">Сгенерировать пароль</button>
        </form>

        {% if password %}
        <div class="password-result">
            <h2>Сгенерированный пароль:</h2>
            <div class="password">{{ password }}</div>
        </div>
        {% endif %}
    </div>
</body>
</html>
